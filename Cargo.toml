# =============================================================================
#  R E P S   ·   treesitter-lang
# =============================================================================
[package]
name    = "treesitter-lang"
version = "1.0.0"

# Minimum Supported Rust Version (MSRV)
rust-version = "1.85"
edition = "2024"

# License
license = "Apache-2.0 OR MIT"

# Readme
readme = "README.md"

# Description
description = "Generate Tree-sitter grammars (grammar.js and grammar.json) and corpus tests from Rust."

# Keywords (5 max)
keywords = ["tree-sitter", "grammar", "parser", "language", "codegen"]

# Categories
categories = ["development-tools", "parsing", "text-editors"]

# Links
homepage      = "https://github.com/jamesgober/treesitter-lang"
repository    = "https://github.com/jamesgober/treesitter-lang"
documentation = "https://docs.rs/treesitter-lang"

# Authors
authors = ["James Gober <me@jamesgober.com>"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "treesitter_lang"
path = "src/lib.rs"


# FEATURE FLAGS
# #################################
[features]
default = ["std"]
# The standard library. Without it the crate is `no_std` and needs only `alloc`.
std = ["syntax-lang/std"]


# DEPENDENCIES
# #################################
[dependencies]
# The family's concrete syntax tree. `Grammar::sexp` renders a
# `syntax_lang::Node` as the S-expression tree-sitter prints, which turns the
# trees a hand-written parser builds into tree-sitter corpus tests. Re-exported
# so callers always name the same version.
syntax-lang = { version = "1", default-features = false }


# DEV DEPENDENCIES
# #################################
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest  = "1"


# BENCHMARKS
# #################################
[[bench]]
name    = "bench"
harness = false


# RELEASE PROFILE
# #################################
[profile.release]
opt-level     = 3
lto           = "fat"
codegen-units = 1
panic         = "abort"
strip         = "symbols"
